# Copy relevant sections into ~/.hermes/config.yaml after Hermes is installed.

model:
  provider: custom
  default: qwen3.5:9b
  base_url: http://192.168.1.34:11434/v1
  api_key: ollama-local
  context_length: 65536

mcp_servers:
  openclaw:
    command: openclaw
    args:
      - mcp
      - serve

display:
  tool_progress: all
  streaming: true

group_sessions_per_user: true
